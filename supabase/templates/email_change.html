<!--
  Sent when a user changes their account email from Settings -> Account.

  With double_confirm_changes OFF this goes to the NEW address only, and opening
  the link applies the change. Turning that setting back on would send this same
  template to the current address too (GoTrue can't tell the template which
  recipient it is rendering for) — the copy below would then be wrong, and the
  app's "open the link we sent to X" copy with it.

  Variables: .Email (current), .NewEmail, .ConfirmationURL, .TokenHash, .Token,
  .SiteURL, .RedirectTo.

  Not auto-deployed — paste into Dashboard -> Authentication -> Emails ->
  "Change Email Address" when it changes (docs/release.md).
-->
<h2>Confirm your new email address</h2>

<p>
  You asked to change the email address on your Running Coach account from
  <strong>{{ .Email }}</strong> to this one.
</p>

<p><a href="{{ .ConfirmationURL }}">Confirm this address</a></p>

<p>Until you open that link, your account keeps its current address.</p>

<p>If you didn't request this change, ignore this email and nothing will happen.</p>
