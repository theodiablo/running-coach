name: Coach live eval

# On-demand only — every run makes real Anthropic API calls (roughly $0.10-0.30
# on Sonnet per trial set; see evals/coach/README.md). Replays the eval
# scenarios through the production proposal loop against the live model, fails
# on any SAFETY grader miss, and uploads the full JSON report as an artifact.
on:
  workflow_dispatch:
    inputs:
      model:
        description: Model to evaluate (COACH_EVAL_MODEL)
        required: false
        default: claude-sonnet-5
        type: string
      trials:
        description: Trials per scenario (COACH_EVAL_TRIALS)
        required: false
        default: "1"
        type: string
      scenarios:
        description: Optional comma-separated scenario ids to run (COACH_EVAL_SCENARIOS)
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Fail fast with a clear message instead of silently skipping the suite
      # (the harness skips itself when the key is absent, which would read as
      # a green no-op run here). The required key follows the model name,
      # mirroring the harness's own provider routing (mistral.mjs).
      - name: Check the model's API key is configured
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          MODEL: ${{ inputs.model }}
        run: |
          case "$MODEL" in
            mistral*|magistral*|ministral*|codestral*|pixtral*|open-mistral*|open-mixtral*)
              KEY_NAME=MISTRAL_API_KEY KEY_VALUE="$MISTRAL_API_KEY" ;;
            *)
              KEY_NAME=ANTHROPIC_API_KEY KEY_VALUE="$ANTHROPIC_API_KEY" ;;
          esac
          if [ -z "$KEY_VALUE" ]; then
            echo "::error::$KEY_NAME repo secret is not set (required for model $MODEL) — add it under Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Live eval
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          COACH_EVAL_MODEL: ${{ inputs.model }}
          COACH_EVAL_TRIALS: ${{ inputs.trials }}
          COACH_EVAL_SCENARIOS: ${{ inputs.scenarios }}
        run: npm run eval:live

      # Keep the report even when a safety gate fails — that's exactly the run
      # you want to inspect.
      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coach-eval-report
          path: evals/coach/results/
          if-no-files-found: warn
