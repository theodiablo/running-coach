# Requests one page from each candidate race source from GitHub's runners and
# reports the status in the job summary: some sites refuse datacenter
# addresses (running.life answered 403 to the crawler). Reads public pages
# only; no secrets. Detail: docs/race-crawler.md.

name: Race source probe

on:
  workflow_dispatch: {}
  pull_request:
    paths:
      - .github/workflows/race-source-probe.yml
      - scripts/race-crawler/probe.mjs

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Probe
        run: node scripts/race-crawler/probe.mjs
