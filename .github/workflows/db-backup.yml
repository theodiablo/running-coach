# Daily logical backup of the Supabase database to S3.
#
# Why this exists: the entire app state lives in one jsonb row per user
# (public.app_state) that the client replaces wholesale on every write. There is
# no history table, so a bad write is unrecoverable from within the database —
# in July 2026 a failed read overwrote a real user's runs and plan, and the only
# reason it was recoverable was that the coach agent happened to keep an audit
# log. This job is the actual safety net.
#
# Each run writes ONE tarball to
#   s3://$BACKUP_S3_BUCKET/$BACKUP_PREFIX/run-app-<UTC timestamp>.tar.gz
# containing three pg_dump outputs (roles, schema, data) — the split Supabase
# documents for restores. Backups older than RETENTION_DAYS are then deleted,
# except that the MIN_KEEP most recent are ALWAYS kept whatever their age, so a
# scheduling gap or a clock problem can never empty the bucket.
#
# ---------------------------------------------------------------------------
# Setup (the job skips itself, loudly, until these exist)
#
# 1. Secret SUPABASE_DB_URL — Dashboard → Connect → Session pooler → URI, with
#    the real password substituted. Use the POOLER host, not
#    db.<ref>.supabase.co: direct database hostnames are IPv6-only and GitHub
#    runners are IPv4-only. Percent-encode any special characters in the
#    password.
#
#    Connect as the dedicated `db_backup` role, NOT as postgres. The job only
#    reads, and postgres owns every table in public and can drop them. The role
#    is created by supabase/migrations/20260726120000_db_backup_role.sql; its
#    password is set out of band. It holds BYPASSRLS deliberately — every table
#    in public has RLS on, so a role without it dumps zero rows.
#
#    This is also why the dumps call pg_dump directly rather than
#    `supabase db dump`: every one of the CLI's dump scripts hardcodes
#    `--role postgres`, so the CLI cannot be used with a least-privilege role.
#
# 2. Secret BACKUP_S3_BUCKET — a PRIVATE bucket. Do NOT reuse S3_BUCKET_NAME:
#    that one is the CloudFront origin for the site and is world-readable.
#    These dumps contain personal health data (runs, heart rate, notes), so
#    the bucket needs Block Public Access on and, ideally, a short
#    non-current-version expiry.
#
# 3. AWS access — reuses the existing OIDC deploy role unless a dedicated
#    AWS_BACKUP_ROLE_ARN is set (preferred: it keeps write access to the
#    backup bucket out of the deploy role). The role needs:
#
#      { "Effect": "Allow",
#        "Action": ["s3:PutObject", "s3:GetObject", "s3:DeleteObject"],
#        "Resource": "arn:aws:s3:::<backup-bucket>/*" },
#      { "Effect": "Allow",
#        "Action": "s3:ListBucket",
#        "Resource": "arn:aws:s3:::<backup-bucket>" }
#
#    and its trust policy must allow this repository's OIDC subject.
#
# Restoring is documented in docs/backups.md.

name: Database backup

on:
  schedule:
    - cron: "20 2 * * *" # daily, 02:20 UTC (off the hour: shared runner capacity)
  workflow_dispatch: {}

permissions:
  id-token: write # OIDC -> AWS
  contents: read

concurrency:
  group: db-backup
  cancel-in-progress: false

env:
  BACKUP_PREFIX: supabase
  # Must match the server's major version: pg_dump refuses to dump a server
  # newer than itself. Bump this when Supabase upgrades the project.
  PG_MAJOR: "17"
  RETENTION_DAYS: 30
  # Never prune below this many backups, however old they are. Without it, a
  # month of failed scheduled runs followed by one successful prune would leave
  # the bucket empty.
  MIN_KEEP: 7
  # Reject a dump carrying fewer than this many app_state rows. Guards against a
  # dump that is structurally valid but silently empty, which is what an RLS
  # filter produces when the connecting role lacks BYPASSRLS. Raise it if you
  # want a tighter floor; it must stay at or below the real account count.
  MIN_APP_STATE_ROWS: 1

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Check configuration
        id: cfg
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
          ROLE: ${{ secrets.AWS_BACKUP_ROLE_ARN || secrets.AWS_DEPLOY_ROLE_ARN }}
        run: |
          set -euo pipefail
          missing=""
          if [ -z "$DB_URL" ]; then missing="$missing SUPABASE_DB_URL"; fi
          if [ -z "$BUCKET" ]; then missing="$missing BACKUP_S3_BUCKET"; fi
          if [ -z "$ROLE" ]; then missing="$missing AWS_BACKUP_ROLE_ARN/AWS_DEPLOY_ROLE_ARN"; fi
          if [ -n "$missing" ]; then
            {
              echo "## Database backup skipped"
              echo
              echo "Not configured yet. Missing secrets:$missing"
              echo
              echo "See the header of \`.github/workflows/db-backup.yml\` for setup."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::db-backup skipped — missing secrets:$missing"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.cfg.outputs.ready == 'true'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install PostgreSQL client
        if: steps.cfg.outputs.ready == 'true'
        run: |
          set -euo pipefail
          # From PGDG, the PostgreSQL project's own apt repository, pinned to the
          # server's major version. Ubuntu's default pg_dump is a major version
          # behind and refuses to dump PG17 outright.
          sudo install -d /usr/share/postgresql-common/pgdg
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo tee /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc > /dev/null
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq "postgresql-client-${PG_MAJOR}"
          pg_dump --version

      - name: Dump database
        id: dump
        if: steps.cfg.outputs.ready == 'true'
        env:
          # Scoped to this step only — never a workflow-level env block.
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          stamp="$(date -u +%Y%m%dT%H%M%SZ)"
          dir="backup/run-app-$stamp"
          mkdir -p "$dir"

          # Three dumps, matching Supabase's documented restore order.
          #
          # pg_dump directly, NOT `supabase db dump`. All three of the CLI's dump
          # scripts hardcode `--role postgres`, so the CLI can only ever run as a
          # role that is a member of postgres. That is incompatible with a
          # least-privilege backup role, and granting the membership would hand
          # this credential the ability to drop every table, which is the exact
          # thing the dedicated role exists to prevent. Without --role, pg_dump
          # runs with db_backup's own privileges: pg_read_all_data + BYPASSRLS.
          #
          # No --quote-all-identifier either: it emits COPY "public"."app_state",
          # which the row-count guard below would not recognise.
          #
          # All application data lives in public; storage is unused.
          # supabase_migrations carries the applied-migration history, which is
          # small and worth having alongside it.
          schemas=(--schema public --schema supabase_migrations)

          echo "::group::roles"
          # --no-role-passwords reads pg_roles rather than pg_authid, which a
          # non-superuser cannot read.
          pg_dumpall --dbname "$SUPABASE_DB_URL" --roles-only --no-role-passwords > "$dir/roles.sql"
          echo "::endgroup::"
          echo "::group::schema"
          pg_dump --dbname "$SUPABASE_DB_URL" --schema-only "${schemas[@]}" > "$dir/schema.sql"
          echo "::endgroup::"
          echo "::group::data"
          # pg_dump emits COPY blocks for data by default: they restore far
          # faster than per-row INSERTs and survive rows that would trip a
          # per-statement error.
          pg_dump --dbname "$SUPABASE_DB_URL" --data-only "${schemas[@]}" > "$dir/data.sql"
          echo "::endgroup::"

          # A backup that silently contains nothing is worse than no backup —
          # it reads as success forever. Refuse to upload one.
          for f in roles schema data; do
            if [ ! -s "$dir/$f.sql" ]; then
              echo "::error::$f.sql is empty — refusing to upload this backup."
              exit 1
            fi
          done
          if ! grep -q "CREATE TABLE" "$dir/schema.sql"; then
            echo "::error::schema.sql has no CREATE TABLE statements — refusing to upload."
            exit 1
          fi
          # app_state is the irreplaceable table: one jsonb row per user, no
          # history. If it is not in the data dump, the backup is worthless.
          # Quote-tolerant: pg_dump emits COPY public.app_state, but a future
          # --quote-all-identifier would make it COPY "public"."app_state", and
          # a guard that silently stopped matching would wave through an empty
          # backup rather than fail.
          if ! grep -Eq '^COPY "?public"?\."?app_state"?[ (]' "$dir/data.sql"; then
            echo "::error::data.sql has no COPY public.app_state block — refusing to upload."
            exit 1
          fi

          # ...and the COPY block must actually contain rows. Presence of the
          # header proves nothing: every table in public has RLS enabled, so a
          # connection whose role lacks BYPASSRLS dumps the header followed
          # immediately by the \. terminator, with every row filtered out. That
          # is a backup that is empty but reads as success forever, which is the
          # precise failure this job exists to prevent. Count the rows between
          # the header and the terminator.
          # The terminator is built with sprintf rather than written as a literal
          # "\\." so that no YAML/shell/awk escaping layer can silently eat the
          # backslash. If it did, the block would never close, the count would
          # run to end of file, and the guard would pass on a dump it should
          # have rejected.
          rows="$(awk '
            BEGIN                                  { term = sprintf("%c.", 92) }
            /^COPY "?public"?\."?app_state"?[ (]/   { inblock = 1; next }
            inblock && $0 == term                   { inblock = 0; next }
            inblock                                 { n++ }
            END                                     { print n + 0 }
          ' "$dir/data.sql")"
          if [ "$rows" -lt "$MIN_APP_STATE_ROWS" ]; then
            echo "::error::data.sql has only $rows public.app_state row(s), expected at least $MIN_APP_STATE_ROWS — refusing to upload. If the backup role was recently changed, check it has BYPASSRLS."
            exit 1
          fi
          echo "app_state rows in dump: $rows"

          archive="run-app-$stamp.tar.gz"
          tar -czf "$archive" -C backup "run-app-$stamp"
          size="$(stat -c %s "$archive")"

          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "stamp=$stamp"     >> "$GITHUB_OUTPUT"
          echo "size=$size"       >> "$GITHUB_OUTPUT"
          echo "Built $archive ($size bytes)"

      - name: Configure AWS credentials
        if: steps.cfg.outputs.ready == 'true'
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6.2.2
        with:
          aws-region: ${{ secrets.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_BACKUP_ROLE_ARN || secrets.AWS_DEPLOY_ROLE_ARN }}

      - name: Upload to S3
        id: upload
        if: steps.cfg.outputs.ready == 'true'
        env:
          BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
          ARCHIVE: ${{ steps.dump.outputs.archive }}
        run: |
          set -euo pipefail
          key="$BACKUP_PREFIX/$ARCHIVE"
          aws s3 cp "$ARCHIVE" "s3://$BUCKET/$key" --sse AES256

          # Read it back: a cp that "succeeded" but stored a truncated object is
          # exactly the failure this job exists to prevent.
          remote="$(aws s3api head-object --bucket "$BUCKET" --key "$key" --query ContentLength --output text)"
          local="$(stat -c %s "$ARCHIVE")"
          if [ "$remote" != "$local" ]; then
            echo "::error::uploaded size $remote != local size $local for $key"
            exit 1
          fi
          echo "key=$key" >> "$GITHUB_OUTPUT"
          echo "Uploaded s3://$BUCKET/$key ($remote bytes)"

      - name: Prune expired backups
        id: prune
        if: steps.cfg.outputs.ready == 'true'
        env:
          BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
        run: |
          set -euo pipefail
          cutoff="$(date -u -d "$RETENTION_DAYS days ago" +%s)"

          # aws-cli v2 paginates and merges automatically.
          aws s3api list-objects-v2 --bucket "$BUCKET" --prefix "$BACKUP_PREFIX/" \
            --query 'Contents[].{Key:Key,LastModified:LastModified}' --output json > objects.json

          # Only ever consider keys this workflow created: an exact filename
          # pattern under our own prefix. Anything else in the bucket is not
          # ours to delete.
          jq -r \
            --argjson cutoff "$cutoff" \
            --argjson keep "$MIN_KEEP" '
            (. // [])
            | map(select(.Key | test("/run-app-[0-9]{8}T[0-9]{6}Z\\.tar\\.gz$")))
            | sort_by(.LastModified) | reverse
            | .[$keep:]                                   # always retain the newest MIN_KEEP
            | map(select(
                (.LastModified | sub("\\.[0-9]+";"") | sub("\\+00:00$";"Z") | fromdateiso8601) < $cutoff
              ))
            | .[].Key
          ' objects.json > expired.txt

          total="$(jq 'length' objects.json)"
          count="$(wc -l < expired.txt | tr -d ' ')"
          echo "total=$total"     >> "$GITHUB_OUTPUT"
          echo "deleted=$count"   >> "$GITHUB_OUTPUT"

          if [ "$count" = "0" ]; then
            echo "Nothing to prune ($total backups, none older than $RETENTION_DAYS days beyond the $MIN_KEEP kept)."
            exit 0
          fi

          while IFS= read -r key; do
            [ -z "$key" ] && continue
            echo "Deleting $key"
            aws s3api delete-object --bucket "$BUCKET" --key "$key"
          done < expired.txt

      - name: Summary
        if: steps.cfg.outputs.ready == 'true'
        env:
          BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
          KEY: ${{ steps.upload.outputs.key }}
          SIZE: ${{ steps.dump.outputs.size }}
          TOTAL: ${{ steps.prune.outputs.total }}
          DELETED: ${{ steps.prune.outputs.deleted }}
        run: |
          {
            echo "## Database backup"
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| Object | \`s3://$BUCKET/$KEY\` |"
            echo "| Size | $SIZE bytes |"
            echo "| Backups in bucket | $TOTAL |"
            echo "| Pruned (older than $RETENTION_DAYS days) | $DELETED |"
            echo "| Minimum retained | $MIN_KEEP |"
          } >> "$GITHUB_STEP_SUMMARY"
