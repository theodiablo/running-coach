name: CI

# Lint + unit tests + the offline coach-agent eval. The eval uses scripted model
# turns, so CI never calls Anthropic and needs no secrets.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5

      - name: Typecheck
        run: npm run typecheck:all

      - name: Test
        run: npm test

      # Also runs scripts/check-bundle-regex.mjs, which fails on a shipped regex
      # lookbehind — unparseable on our iOS 15 target, and only ever introduced
      # by a dependency, so the built bundle is the only place to catch it.
      - name: Build
        run: npm run build

      - name: Offline coach eval
        run: npm run eval
