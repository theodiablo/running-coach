name: CI

# Lint + typecheck + unit tests + build. `npm test` includes the offline
# coach-agent eval, whose scripted model turns mean CI never calls Anthropic.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5

      # The app's tsc runs inside `npm run build` below; only the Deno half here.
      - name: Typecheck edge functions
        run: npm run typecheck:supabase

      - name: Test
        run: npm test

      # Also runs scripts/check-bundle-regex.mjs, which fails on a shipped regex
      # lookbehind — unparseable on our iOS 15 target, and only ever introduced
      # by a dependency, so the built bundle is the only place to catch it.
      - name: Build
        run: npm run build
