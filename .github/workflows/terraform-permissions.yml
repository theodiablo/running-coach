# Asserts what the Terraform CI roles can and cannot do, via IAM policy
# simulation (infra/permissions-check.sh). See that script for why this
# exists: a pull request only ever exercises the read-only plan role, so a bug
# in the apply role's write policy otherwise surfaces for the first time on a
# failed apply to main.
#
# Runs against the plan role only. Simulation is a read-only IAM action, so
# the plan role's read-only assumability from any branch is enough — this
# never needs the apply role's credentials.
#
# Simulation evaluates the policy that is *deployed*, not the one in the diff,
# so this cannot run on a pull request: on a PR branch it would re-assert the
# live policy and pass no matter what the change says. The earliest honest
# moment is right after apply, which is what the workflow_run trigger is for.

name: Terraform permissions check

on:
  # Terraform applies on merge to main, so this is the first run against the
  # policy the change actually produced. Waiting for the weekly cron would leave
  # a broken apply policy undetected for up to seven days.
  workflow_run:
    workflows: ["Terraform"]
    types: [completed]
    branches: [main]
  workflow_dispatch: {}
  schedule:
    # Mondays 06:00 UTC. Catches drift from a manual/local apply that changed
    # a policy outside of a PR.
    - cron: "0 6 * * 1"

permissions:
  id-token: write # OIDC -> AWS
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # A cancelled or skipped Terraform run changed nothing; a failed one may have
    # applied part of a policy change, which is exactly when this matters.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion != 'cancelled' &&
       github.event.workflow_run.conclusion != 'skipped')
    steps:
      - name: Check configuration
        id: cfg
        env:
          PLAN_ROLE: ${{ secrets.AWS_TF_PLAN_ROLE_ARN }}
        run: |
          set -euo pipefail
          if [ -z "$PLAN_ROLE" ]; then
            echo "::warning::Permissions check skipped — AWS_TF_PLAN_ROLE_ARN is not set."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.cfg.outputs.ready == 'true'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Configure AWS credentials
        if: steps.cfg.outputs.ready == 'true'
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6.2.2
        with:
          aws-region: ${{ secrets.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_TF_PLAN_ROLE_ARN }}

      - name: Run permission checks
        if: steps.cfg.outputs.ready == 'true'
        run: bash infra/permissions-check.sh
