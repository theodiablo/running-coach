# TEMPORARY: delete before merging the infra-hardening PR.
#
# Proves the `sub` an environment job mints before the roles are re-trusted to
# `environment:<name>` (infra/terraform_roles.tf). This repo's sub is already
# ID-suffixed against the documented default, so the environment form is read
# off a real token rather than assumed. Prints the sub claim only, never the
# token. `oidc-probe` has no branch rule and no role trusts it.

name: OIDC subject probe

on:
  pull_request:
    paths:
      - ".github/workflows/oidc-subject-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: oidc-probe
    permissions:
      id-token: write
    steps:
      - name: Print the token's sub
        run: |
          set -euo pipefail
          token="$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)"
          echo "::add-mask::$token"
          payload="$(cut -d. -f2 <<<"$token" | tr '_-' '/+')"
          while [ $(( ${#payload} % 4 )) -ne 0 ]; do payload="$payload="; done
          sub="$(base64 -d <<<"$payload" | jq -r .sub)"
          echo "sub: $sub"
          echo "### OIDC sub: \`$sub\`" >> "$GITHUB_STEP_SUMMARY"
