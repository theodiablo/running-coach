# Daily Supabase log and security-advisor scan (scripts/log-scan.sh). Silent on a
# quiet day; fails, so GitHub notifies, when something crosses a threshold.
# Setup and tuning: docs/monitoring.md.

name: Supabase log scan

on:
  schedule:
    - cron: "13 6 * * *" # daily; scans the 24 h before it
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: log-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Holds SUPABASE_LOGS_TOKEN; its branch rule must allow main only.
    environment: monitoring
    steps:
      - name: Check configuration
        id: cfg
        env:
          TOKEN: ${{ secrets.SUPABASE_LOGS_TOKEN }}
          REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          # Skip loudly rather than fail red while the token is still missing.
          if [ -z "$TOKEN" ] || [ -z "$REF" ]; then
            echo "::warning::log scan skipped: SUPABASE_LOGS_TOKEN (monitoring environment) or SUPABASE_PROJECT_REF is not set. See docs/monitoring.md."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.cfg.outputs.ready == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts

      - name: Scan
        if: steps.cfg.outputs.ready == 'true'
        env:
          SUPABASE_LOGS_TOKEN: ${{ secrets.SUPABASE_LOGS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: bash scripts/log-scan.sh

      # Supabase can't report a token's expiry, so its date is kept by hand. Fails
      # (so GitHub emails) in the last week, after the scan has still run.
      - name: Token expiry
        if: ${{ !cancelled() && steps.cfg.outputs.ready == 'true' }}
        env:
          EXPIRES: ${{ vars.SUPABASE_LOGS_TOKEN_EXPIRES }}
        run: |
          set -euo pipefail
          hint="Set SUPABASE_LOGS_TOKEN_EXPIRES (monitoring environment variable, YYYY-MM-DD) to be told before the token runs out."
          [[ "$EXPIRES" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] && exp=$(date -u -d "$EXPIRES" +%s 2>/dev/null) \
            || { echo "::warning::$hint"; exit 0; }
          days=$(( (exp - $(date -u -d "$(date -u +%F)" +%s)) / 86400 ))
          echo "Supabase logs token: $days day(s) left (expires $EXPIRES)." >> "$GITHUB_STEP_SUMMARY"
          if [ "$days" -lt 0 ]; then
            echo "::error::The Supabase logs token expired on $EXPIRES. Create a new scoped token and update SUPABASE_LOGS_TOKEN and SUPABASE_LOGS_TOKEN_EXPIRES (docs/monitoring.md)."
            exit 1
          elif [ "$days" -le 7 ]; then
            echo "::error::The Supabase logs token expires in $days day(s), on $EXPIRES. Create a new scoped token and update SUPABASE_LOGS_TOKEN and SUPABASE_LOGS_TOKEN_EXPIRES (docs/monitoring.md)."
            exit 1
          fi
